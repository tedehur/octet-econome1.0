<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1222"/>
      <stop offset="100%" stop-color="#131f36"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#152845"/>
      <stop offset="100%" stop-color="#1c355a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#89c3ff"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #edf5ff; }
      .subtitle { font: 600 18px 'Segoe UI', sans-serif; fill: #dcecff; }
      .label { font: 600 18px 'Segoe UI', sans-serif; fill: #eef6ff; }
      .small { font: 500 13px 'Segoe UI', sans-serif; fill: #bfd7fb; }
      .panel { fill: url(#panel); stroke: #8ec1ff; stroke-width: 2; filter: url(#shadow); }
      .arrow-line { stroke: #8ec1ff; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="60" y="60" class="title">Architecture globale — octet-econome1.0</text>
  <text x="60" y="92" class="subtitle">Codage spatial • reconstruction géométrique • refus sûr</text>

  <rect class="panel" x="70" y="150" width="180" height="110" rx="22"/>
  <text x="160" y="196" text-anchor="middle" class="label">Application</text>
  <text x="160" y="220" text-anchor="middle" class="small">octet source</text>

  <rect class="panel" x="310" y="150" width="230" height="110" rx="22"/>
  <text x="425" y="196" text-anchor="middle" class="label">Encodeur Bibrai</text>
  <text x="425" y="220" text-anchor="middle" class="small">8 bits → cellule 3×3</text>

  <rect class="panel" x="610" y="150" width="220" height="110" rx="22"/>
  <text x="720" y="196" text-anchor="middle" class="label">Cellule</text>
  <text x="720" y="220" text-anchor="middle" class="small">couronne + parité</text>

  <rect class="panel" x="900" y="150" width="220" height="110" rx="22"/>
  <text x="1010" y="196" text-anchor="middle" class="label">Canal réseau</text>
  <text x="1010" y="220" text-anchor="middle" class="small">perte locale</text>

  <rect class="panel" x="1170" y="150" width="180" height="110" rx="22"/>
  <text x="1260" y="196" text-anchor="middle" class="label">Récepteur</text>
  <text x="1260" y="220" text-anchor="middle" class="small">cellule partielle</text>

  <path class="arrow-line" d="M250 205 H310"/>
  <path class="arrow-line" d="M540 205 H610"/>
  <path class="arrow-line" d="M830 205 H900"/>
  <path class="arrow-line" d="M1120 205 H1170"/>

  <rect class="panel" x="255" y="360" width="250" height="120" rx="22"/>
  <text x="380" y="407" text-anchor="middle" class="label">Contrôle parité</text>
  <text x="380" y="433" text-anchor="middle" class="small">vérification locale</text>

  <rect class="panel" x="575" y="360" width="290" height="120" rx="22"/>
  <text x="720" y="407" text-anchor="middle" class="label">Reconstruction</text>
  <text x="720" y="433" text-anchor="middle" class="small">géométrie + énumération</text>

  <rect class="panel" x="925" y="360" width="270" height="120" rx="22"/>
  <text x="1060" y="407" text-anchor="middle" class="label">Mémoire de texture</text>
  <text x="1060" y="433" text-anchor="middle" class="small">score de plausibilité</text>

  <path class="arrow-line" d="M1260 260 V320 H380 V360"/>
  <path class="arrow-line" d="M1260 260 V320 H720 V360"/>
  <path class="arrow-line" d="M1260 260 V320 H1060 V360"/>

  <rect class="panel" x="570" y="615" width="310" height="120" rx="22"/>
  <text x="725" y="668" text-anchor="middle" class="label">Sortie sûre</text>
  <text x="725" y="695" text-anchor="middle" class="small">octet exact ou refus</text>

  <path class="arrow-line" d="M380 480 V545 H620 V615"/>
  <path class="arrow-line" d="M720 480 V615"/>
  <path class="arrow-line" d="M1060 480 V545 H830 V615"/>
</svg>
